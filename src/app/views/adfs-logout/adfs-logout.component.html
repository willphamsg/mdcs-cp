<div class="container">
  <p>Signing out, please wait... or <a [href]="redirect">Click here to redirect</a></p>
  <!-- Only once there is a URL to load: an iframe with no src still costs an
       about:blank document + frame. -->
  @if (sanitizedUrl) {
    <iframe
      title="Sign-out"
      [src]="sanitizedUrl"
      style="display: none;"
      allowfullscreen="false"></iframe>
  }
</div>
