<div class="report-container">
  @if (!sanitizedUrl) {
    <div class="empty-depot-display">
      <img src="/assets/icons/camera.svg" alt="empty files" />
      <p>Complete selection to view info.</p>
      <p>No data to display.</p>
    </div>
  }
  @if (isReportRendering) {
    <div class="report-loading-overlay">
      <mat-spinner diameter="56" color="primary"></mat-spinner>
      <p>Loading report...</p>
    </div>
  }
  <div [ngClass]="{ active: isIframeLoaded, hidden: !isIframeLoaded }">
    <iframe
      [src]="sanitizedUrl"
      width="100%"
      height="600px"
      title="SSRS report viewer"
      style="border: 0"
      allowfullscreen="false"
      (load)="onIframeLoad()"></iframe>
  </div>
</div>
